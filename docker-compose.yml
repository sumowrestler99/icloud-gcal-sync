services:
  sync:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      ICLOUD_USERNAME: ""
      ICLOUD_APP_PASSWORD: ""
      ICLOUD_CALENDAR_NAME: ""
      GOOGLE_CALENDAR_ID: primary
      SYNC_PAST_DAYS: 30
      SYNC_FUTURE_DAYS: 365
      SYNC_INTERVAL_MINUTES: 15
    volumes:
      - ./data:/app/data
    restart: unless-stopped
