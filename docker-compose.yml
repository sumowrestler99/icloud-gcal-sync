services:
  sync:
    build: .
    env_file: .env
    environment:
      SYNC_PAST_DAYS: 30
      SYNC_FUTURE_DAYS: 365
      SYNC_INTERVAL_MINUTES: 15
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
